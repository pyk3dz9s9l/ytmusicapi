name: Code coverage
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Setup PDM
      uses: pdm-project/setup-pdm@v4
    - name: create-json
      uses: jsdaniell/create-json@v1.2.3
      with:
        name: oauth.json
        dir: tests/
        json: ${{ secrets.OAUTH_JSON }}
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: workspace listing"
        ls -la "$GITHUB_WORKSPACE" 2>/dev/null || echo "GERALT_DBG: cannot list workspace"
        echo "GERALT_DBG: pyproject.toml present: $(test -f "$GITHUB_WORKSPACE/pyproject.toml" && echo yes || echo no)"
        echo "GERALT_DBG: tests/oauth.json present: $(test -f "$GITHUB_WORKSPACE/tests/oauth.json" && echo yes || echo no)"
        echo "GERALT_DBG: head sha: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || echo unknown)"
      continue-on-error: true
    - name: Install dependencies
      run: pdm install
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: tests dir listing"
        ls -la "$GITHUB_WORKSPACE/tests" 2>/dev/null || echo "GERALT_DBG: no tests dir"
        echo "GERALT_DBG: conftest.py present: $(test -f "$GITHUB_WORKSPACE/tests/conftest.py" && echo yes || echo no)"
        echo "GERALT_DBG: oauth.json present: $(test -f "$GITHUB_WORKSPACE/tests/oauth.json" && echo yes || echo no)"
      continue-on-error: true
    - name: Generate coverage report
      env:
        HEADERS_AUTH: ${{ secrets.HEADERS_AUTH }}
        TEST_CFG: ${{ secrets.TEST_CFG }}
      run: |
        curl -o tests/test.mp3 https://www.kozco.com/tech/piano2-CoolEdit.mp3
        cat <<< "$HEADERS_AUTH" > tests/browser.json
        cat <<< "$TEST_CFG" > tests/test.cfg
        pdm run pytest --junitxml=test-results.xml
        pdm run coverage xml
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    paths:
    - ytmusicapi/**
    - tests/**
  pull_request_target:
    paths:
    - ytmusicapi/**
    - tests/**
