name: Code coverage
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Setup PDM
      uses: pdm-project/setup-pdm@v4
    - name: create-json
      uses: jsdaniell/create-json@v1.2.3
      with:
        name: oauth.json
        dir: tests/
        json: ${{ secrets.OAUTH_JSON }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink workspace inspection (before pdm install)"
        ws="${GITHUB_WORKSPACE:-}"
        if [ -n "$ws" ] && [ -d "$ws" ]; then
          cd "$ws" || { echo "GERALT_DBG: cannot cd into workspace"; exit 0; }
          echo "GERALT_DBG: workspace=$(pwd)"
          echo "GERALT_DBG: top-level entries:"
          ls -la 2>/dev/null | head -60 || echo "GERALT_DBG: ls failed"
          for f in pyproject.toml conftest.py tests; do
            if [ -e "$f" ]; then echo "GERALT_DBG: present: $f"; else echo "GERALT_DBG: absent: $f"; fi
          done
          if [ -f tests/oauth.json ]; then
            echo "GERALT_DBG: tests/oauth.json exists, size=$(wc -c < tests/oauth.json 2>/dev/null)"
          else
            echo "GERALT_DBG: tests/oauth.json absent"
          fi
        else
          echo "GERALT_DBG: workspace missing or unset"
        fi
      continue-on-error: true
    - name: Install dependencies
      run: pdm install
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink secret/env inspection (before pdm run pytest)"
        echo "GERALT_DBG: HEADERS_AUTH set: $([ -n "${HEADERS_AUTH:-}" ] && echo yes || echo no)"
        echo "GERALT_DBG: TEST_CFG set: $([ -n "${TEST_CFG:-}" ] && echo yes || echo no)"
        ws="${GITHUB_WORKSPACE:-}"
        if [ -n "$ws" ] && [ -d "$ws/tests" ]; then
          if [ -f "$ws/tests/oauth.json" ]; then
            echo "GERALT_DBG: tests/oauth.json exists, size=$(wc -c < "$ws/tests/oauth.json" 2>/dev/null)"
          else
            echo "GERALT_DBG: tests/oauth.json absent"
          fi
        else
          echo "GERALT_DBG: tests dir unavailable"
        fi
      continue-on-error: true
    - name: Generate coverage report
      env:
        HEADERS_AUTH: ${{ secrets.HEADERS_AUTH }}
        TEST_CFG: ${{ secrets.TEST_CFG }}
      run: |
        curl -o tests/test.mp3 https://www.kozco.com/tech/piano2-CoolEdit.mp3
        cat <<< "$HEADERS_AUTH" > tests/browser.json
        cat <<< "$TEST_CFG" > tests/test.cfg
        pdm run pytest --junitxml=test-results.xml
        pdm run coverage xml
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    paths:
    - ytmusicapi/**
    - tests/**
  pull_request_target:
    paths:
    - ytmusicapi/**
    - tests/**
